global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:

  # Prometheus monitors its own internal metrics.
  - job_name: "prometheus"

    static_configs:
      - targets:
          - "prometheus:9090"

        labels:
          environment: "development"
          service: "prometheus"
          server_role: "observability"
  - job_name: "alertmanager"

    static_configs:
      - targets:
          - "alertmanager:9093"

        labels:
          environment: "development"
          service: "alertmanager"
          server_role: "observability"

  # Host-level metrics from both virtual machines.
  - job_name: "node-exporter"

    static_configs:

      - targets:
          - "192.168.100.87:9100"

        labels:
          environment: "development"
          host_name: "application-vm-01"
          server_role: "application"

      - targets:
          - "192.168.100.88:9100"

        labels:
          environment: "development"
          host_name: "observability-vm-01"
          server_role: "observability"

  # Internal metrics of Blackbox Exporter itself.
  - job_name: "blackbox-exporter"

    static_configs:
      - targets:
          - "blackbox-exporter:9115"

        labels:
          environment: "development"
          service: "blackbox-exporter"

  # Synthetic HTTP checks.
  - job_name: "blackbox-http"

    scrape_interval: 60s
    scrape_timeout: 15s

    metrics_path: /probe

    params:
      module:
        - http_2xx

    static_configs:

      - targets:
          - "https://example.com"

        labels:
          environment: "development"
          target_name: "example-public-endpoint"
          target_type: "external"

      - targets:
          - "https://www.digikala.com"

        labels:
          environment: "development"
          target_name: "digikala-external-endpoint"
          target_type: "external"

    relabel_configs:

      - source_labels:
          - __address__

        target_label: __param_target

      - source_labels:
          - __param_target

        target_label: instance

      - target_label: __address__

        replacement: "blackbox-exporter:9115"

  - job_name: "blackbox-dns"
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: /probe

    static_configs:
      - targets: ["192.168.100.76:53"]
        labels:
          environment: "development"
          target_name: "bind-resolver"
          dns_transport: "udp"

      - targets: ["192.168.100.76:53"]
        labels:
          environment: "development"
          target_name: "bind-resolver"
          dns_transport: "tcp"

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [dns_transport]
        regex: '(udp|tcp)'
        target_label: __param_module
        replacement: 'dns_bind_$1'

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: "blackbox-exporter:9115"

  - job_name: "mini-devops-app"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["192.168.100.87:8080"]
        labels:
          environment: "test"